<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balances - ZKP Payment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page-wrapper">
        <header class="page-header">
            <h1>Balances</h1>
            <a href="/" class="btn-back">Back to Payment</a>
        </header>

        <div class="cards-grid">
            {% for user in users %}
            <div class="user-card user-{{ user.name|lower }}">
                <div class="user-name">
                    <div class="user-avatar">{{ user.name }}</div>
                    <span>User {{ user.name }}</span>
                </div>
                <div class="user-balance">₹{{ user.balance }}</div>
                <div class="balance-bar">
                    <div class="balance-fill" style="width: {{ user.pct }}%"></div>
                </div>
                <div class="balance-label">
                    <span>Available Funds</span>
                    <span>{{ user.pct }}% of max</span>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
