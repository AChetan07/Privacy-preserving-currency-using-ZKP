<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register User - ZKP Payment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="form-container fade-in-up">
        <h2>Register New User</h2>

        {% if error %}
        <div class="info-box" style="border-left-color: #fa6464; color: #fa6464;">
            {{ error }}
        </div>
        {% endif %}

        <form action="/register" method="POST">
            <div class="form-group">
                <input type="text" name="name" placeholder="User Name (e.g. C, D, Alice)" required maxlength="10">
            </div>
            <div class="form-group">
                <input type="number" name="balance" placeholder="Starting Balance (₹)" required min="0">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                Register User
            </button>
        </form>

        <div class="links">
            <a href="/">← Back to Payment</a>
        </div>
    </div>
</body>
</html>
